name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - master  # Change to 'master' if your default branch is master
  workflow_dispatch:  # Allows manual triggering from GitHub UI

# Environment variables (pulls from GitHub Repository Variables)
env:
  ACR_NAME: ${{ vars.ACR_NAME }}       # e.g. acrproductmanagementapi
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}   # e.g. productmanagementapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required for Azure OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Log in to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Log in to ACR using Azure CLI (leverages the OIDC login session)
      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # 3. Set up Docker Buildx for enhanced build capabilities and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and push the image using Buildx (pointing to your subfolder)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ProdcutManagementAPI
          file: ./ProdcutManagementAPI/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
