name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main  # Trigger workflow on push to main branch
  workflow_dispatch:  # Allows manual triggering from GitHub UI

# Environment variables used across the workflow
env:
  ACR_NAME: ${{ vars.ACR_NAME }} # e.g. myregistry (without .azurecr.io)
  IMAGE_NAME: ${{ vars.IMAGE_NAME }} # e.g. my-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required for Azure OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to Azure using OIDC (Recommended secure method)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Log in to Azure Container Registry
      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          # Reuses the Azure login context established in the step above

      # Set up Docker Buildx for enhanced build capabilities and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image using Buildx
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
